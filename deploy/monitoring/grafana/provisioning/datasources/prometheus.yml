# Grafana 数据源自动配置（文档 10.4）
apiVersion: 1

datasources:
  - name: Prometheus
    uid: alleybite-prometheus
    type: prometheus
    access: proxy
    # Prometheus 已设置 --web.external-url=/prometheus/，路由前缀随之为 /prometheus
    url: http://prometheus:9090/prometheus
    isDefault: true
    editable: false
