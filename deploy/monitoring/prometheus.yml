# Prometheus 抓取与告警规则挂载（文档 10.4）
# 挂载到容器 /etc/prometheus/prometheus.yml
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  # 后端指标：/metrics（内网抓取，nginx 不反代该路径）
  - job_name: alleybite-api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8000"]

  - job_name: prometheus
    # 自抓取：路由前缀为 /prometheus，故自监控指标路径随之变化
    metrics_path: /prometheus/metrics
    static_configs:
      - targets: ["localhost:9090"]
