# 前端托管 + API 反代（文档 10.2）
# 该文件被复制为 /etc/nginx/conf.d/default.conf，故只写 server 块。

# 运行时解析 api 服务名（Docker 内置 DNS），api 容器重建后无需重启 nginx
resolver 127.0.0.11 valid=10s ipv6=off;

# WebSocket 升级（Grafana Live / Alertmanager 界面需要）
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# HTTP：健康检查直通，其余 301 跳 HTTPS
server {
    listen 80;
    server_name _;

    location = /nginx-health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # 证书签发校验路径（正式域名接入 ACME 时可用）
    location /.well-known/acme-challenge/ {
        root /usr/share/nginx/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS：静态托管 + /api 反代 + SPA history 回退
server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # api 上游（配合 resolver 运行时解析）
    set $api_upstream http://api:8000;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # 安全响应头
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # 带 hash 的构建产物长缓存
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # 后端 API 反代（同源，避免跨域）
    location /api/ {
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location = /health {
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
    }

    # --- 监控栈反代（文档 10.4）-------------------------------------------
    # /grafana/、/prometheus/、/alertmanager/ 仅允许回环与内网访问；
    # 需要远程查看请走 SSH 隧道（ssh -L）或把来源网段加入下方 allow 列表。
    # 注意：/metrics 不对外反代，仅由 Prometheus 内网直连 api:8000 抓取。
    set $grafana_upstream      http://grafana:3000;
    set $prometheus_upstream   http://prometheus:9090;
    set $alertmanager_upstream http://alertmanager:9093;

    location = /metrics {
        return 404;
    }

    location /grafana/ {
        allow 127.0.0.1;
        allow ::1;
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        deny all;

        proxy_pass $grafana_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 300s;
    }

    location /prometheus/ {
        allow 127.0.0.1;
        allow ::1;
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        deny all;

        proxy_pass $prometheus_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location /alertmanager/ {
        allow 127.0.0.1;
        allow ::1;
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        deny all;

        proxy_pass $alertmanager_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 120s;
    }

    # SPA history 路由回退（文档 10.2）
    location / {
        try_files $uri $uri/ /index.html;
    }
}