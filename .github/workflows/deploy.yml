# CD（开发文档 10.3）：改为**手动部署**，不再随 CI 自动触发。
#
# 背景：本项目为单机 Docker Compose 部署，日常上线直接在服务器执行
#     git fetch --all && git pull --ff-only origin main && docker compose up -d --build
# 故移除 workflow_run 自动触发，避免 main 上每次 CI 成功都产生一条失败的 Deploy 记录。
#
# 本工作流仅作为**手动备份通道**保留：如需由 GitHub 代为发布，
# 先在仓库 Settings → Secrets and variables → Actions 配置：
#   SSH_HOST     目标服务器地址
#   SSH_USER     SSH 用户
#   SSH_KEY      SSH 私钥（对应公钥已加入服务器 authorized_keys）
#   DEPLOY_PATH  服务器上本仓库的部署目录（含 docker-compose.yml）
# prod 另需在 Settings → Environments 为 production 配置 Required reviewers。
name: Deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 目标环境
        type: choice
        options: [staging, prod]
        default: staging

concurrency:
  group: deploy-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  deploy:
    name: 部署 ${{ inputs.environment }}（手动）
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - name: SSH 发布
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            set -e
            cd ${{ secrets.DEPLOY_PATH }}
            git fetch --all
            git pull --ff-only origin main
            docker compose build
            docker compose up -d
            docker image prune -f