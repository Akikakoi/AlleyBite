# 管理后台独立入口（文档 9.5）：与 C 端同仓不同入口、独立部署。
# 该文件被复制为 /etc/nginx/conf.d/default.conf，故只写 server 块。
# 仅回环与内网网段可访问；远程查看请走 SSH 隧道（ssh -L 8443:127.0.0.1:8443）或 VPN。

# 运行时解析 api 服务名（Docker 内置 DNS），api 容器重建后无需重启 nginx
resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 80;
    server_name _;

    location = /nginx-health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    location / {
        return 301 https://$host:8443$request_uri;
    }
}

server {
    listen 8443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    # 白名单（文档 9.5）：仅回环与内网；新增办公网段请在此追加 allow
    allow 127.0.0.1;
    allow ::1;
    allow 10.0.0.0/8;
    allow 172.16.0.0/12;
    allow 192.168.0.0/16;
    deny all;

    set $api_upstream http://api:8000;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # 后台接口（含 /api/v1/admin/* 与其余运营接口）：仅内网入口可达
    location /api/ {
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 手动触发采集/跑批为同步长任务，需放宽超时
        proxy_read_timeout 300s;
    }

    location = /health {
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
    }

    # SPA history 路由回退
    location / {
        try_files $uri $uri/ /index.html;
    }
}